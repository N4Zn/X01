apply plugin: 'com.android.application'
apply from: 'setupSymbols.gradle'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'

dependencies {
    implementation project(':unityLibrary')
}

android {
    namespace "**NAMESPACE**"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"

    // Cố định 34 thay vì dùng **APIVERSION** — Unity 6000.3.11f1 tự điền compileSdk=30 bất kể
    // Target API Level đang chọn gì hay SDK platform nào đang cài (xác nhận thực tế: máy đã có
    // sẵn android-34/35/36, Target API Level=27, nhưng exported build.gradle vẫn ra 30). Nhiều
    // dependency AndroidX (activity, core, lifecycle, webkit, work...) cần compileSdk >= 31-33 —
    // compileSdk KHÔNG ảnh hưởng targetSdk=27 (vẫn giữ nguyên fix bug USB camera), chỉ quyết định
    // API nào compiler thấy được lúc build.
    compileSdk 34
    buildToolsVersion = "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        applicationId '**APPLICATIONID**'
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**SIGN**

    lint {
        abortOnError false
    }

    buildTypes {
        debug {
            minifyEnabled **MINIFY_DEBUG**
            proguardFiles getDefaultProguardFile('proguard-android.txt')**SIGNCONFIG**
            jniDebuggable true
        }
        release {
            minifyEnabled **MINIFY_RELEASE**
            proguardFiles getDefaultProguardFile('proguard-android.txt')**SIGNCONFIG**
        }
    }**PACKAGING****PLAY_ASSET_PACKS****SPLITS**
**BUILT_APK_LOCATION**
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
        texture {
            enableSplit = true
        }
    }

	**GOOGLE_PLAY_DEPENDENCIES**
}**SPLITS_VERSION_CODE****LAUNCHER_SOURCE_BUILD_SETUP**

// Chỉ target arm64-v8a — loại hẳn các ABI khác (nhất quán với mainTemplate.gradle).
// pickFirst chỉ cần cho arm64-v8a vì opencv + face_recognition_unity + libvlc đều ship libc++_shared.so.
android {
    packaging {
        exclude '/lib/armeabi/**'
        exclude '/lib/armeabi-v7a/**'
        exclude '/lib/mips/**'
        exclude '/lib/mips64/**'
        exclude '/lib/x86/**'
        exclude '/lib/x86_64/**'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}
